services:
  app:
    container_name: modulo-prod-app
    build:
      context: ..
      dockerfile: docker-prod/Dockerfile
      target: app
    env_file:
      - ../.env.production
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=env >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - modulo-prod

  web:
    container_name: modulo-prod-web
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q ok"]
      interval: 15s
      timeout: 3s
      retries: 10
    networks:
      - modulo-prod

  queue-worker:
    container_name: modulo-prod-queue-worker
    build:
      context: ..
      dockerfile: docker-prod/Dockerfile
      target: app
    env_file:
      - ../.env.production
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=120"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - modulo-prod

  scheduler:
    container_name: modulo-prod-scheduler
    build:
      context: ..
      dockerfile: docker-prod/Dockerfile
      target: app
    env_file:
      - ../.env.production
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - modulo-prod

  db:
    container_name: modulo-prod-db
    image: postgres:16-alpine
    env_file:
      - ../.env.production
    environment:
      POSTGRES_DB: ${DB_DATABASE:-modulo_prod}
      POSTGRES_USER: ${DB_USERNAME:-modulo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - modulo-prod

  redis:
    container_name: modulo-prod-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - modulo-prod

volumes:
  app_storage:
  pg_data:
  redis_data:

networks:
  modulo-prod:
    driver: bridge
