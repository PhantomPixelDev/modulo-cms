services:
  app:
    container_name: modulo-prod-app
    build:
      context: ..
      dockerfile: docker-prod/Dockerfile
      target: app
    env_file:
      - ../.env.prod
    environment:
      LARAVEL_ENV_FILE: /var/www/html/.env.prod
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "9000"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - modulo-prod

  web:
    container_name: modulo-prod-web
    image: nginx:alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage:ro
    networks:
      - modulo-prod

  db:
    container_name: modulo-prod-db
    image: postgres:16-alpine
    env_file:
      - ../.env.prod
    environment:
      POSTGRES_DB: ${DB_DATABASE:-modulo_prod}
      POSTGRES_USER: ${DB_USERNAME:-modulo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - modulo-prod

  redis:
    container_name: modulo-prod-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - modulo-prod

volumes:
  app_storage:
  pg_data:
  redis_data:

networks:
  modulo-prod:
    driver: bridge
