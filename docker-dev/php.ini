; Development overrides.
;
; The project is bind-mounted from the Windows filesystem, where a single
; stat() costs roughly 2ms instead of 0.09ms on a native volume. Laravel
; touches hundreds of files per request, so path resolution -- not PHP --
; dominates the response time. These settings cut that down.

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; Resolving a path means stat'ing every segment of it. Caching those results
; for longer is the single biggest win on a slow mount; the default 4M fills
; up long before Laravel has finished booting.
realpath_cache_size = 32M
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Edits must still be picked up, but re-stat'ing every cached file more often
; than this is pure overhead on a bind mount.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
