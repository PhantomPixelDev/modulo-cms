services:
  app:
    container_name: modulo-dev-app
    build:
      context: ..
      dockerfile: docker-dev/Dockerfile
      target: app
    env_file:
      - ../.env.dev
    volumes:
      - ../:/var/www/html:cached
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=env >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    networks:
      - modulo-dev

  mailpit:
    container_name: modulo-dev-mailpit
    image: axllent/mailpit:latest
    networks:
      - modulo-dev
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    container_name: modulo-dev-web
    image: nginx:alpine
    depends_on:
      app:
        condition: service_started
    volumes:
      - ../public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - modulo-dev
    ports:
      - "8080:80"

  vite:
    container_name: modulo-dev-vite
    build:
      context: ..
      dockerfile: docker-dev/Dockerfile
      target: vite
    env_file:
      - ../.env.dev
    volumes:
      - ../:/app:cached
      - vite_node_modules:/app/node_modules
    networks:
      - modulo-dev
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(()=>process.exit(0)).catch(()=>process.exit(1))\" "]
      interval: 10s
      timeout: 5s
      retries: 20

  db:
    container_name: modulo-dev-db
    image: postgres:16-alpine
    env_file:
      - ../.env.dev
    environment:
      POSTGRES_DB: ${DB_DATABASE:-modulo}
      POSTGRES_USER: ${DB_USERNAME:-modulo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - modulo-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_vendor:
  app_storage:
  vite_node_modules:
  pg_data:

networks:
  modulo-dev:
    driver: bridge
