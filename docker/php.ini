; Production overrides (loaded after php.ini-production)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Core code only changes on image rebuilds, but plugins are installed and
; updated at runtime into the plugins volume. Revalidating every few seconds
; costs one stat() per file per interval and means an updated plugin is served
; within seconds instead of stale bytecode until the next restart.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.jit = tracing
opcache.jit_buffer_size = 64M
