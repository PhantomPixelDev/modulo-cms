name: release

# Builds and publishes a release from a tag pushed by release-please.
#
# Two delivery channels, because the project supports both Docker and
# bare-metal installs:
#   - multi-arch images on GHCR
#   - a tarball with vendor/ and public/build already built, so a bare-metal
#     install needs neither Composer nor Node on the target host
#
# Run it manually with workflow_dispatch to rehearse a build without tagging;
# that path publishes nothing.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.2.0'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry_run_version:
        description: 'Version to rehearse a build with (nothing is published)'
        required: false
        default: '0.0.0-rc.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the release on the same suites that guard every push, rather than
  # duplicating them here and letting the two drift apart.
  tests:
    uses: ./.github/workflows/tests.yml

  lint:
    uses: ./.github/workflows/lint.yml

  # The install wizard in a real browser: the one path every new site takes.
  e2e:
    uses: ./.github/workflows/e2e.yml

  prepare:
    name: prepare
    runs-on: ubuntu-latest
    needs: [tests, lint, e2e]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_base: ${{ steps.meta.outputs.image_base }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      built_at: ${{ steps.meta.outputs.built_at }}
      publish: ${{ steps.meta.outputs.publish }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.tag }}" ]; then
            raw="${{ inputs.tag }}"
            publish=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            raw="${GITHUB_REF_NAME}"
            publish=true
          else
            raw="${{ inputs.dry_run_version }}"
            publish=false
          fi

          version="${raw#v}"

          # GHCR rejects uppercase, and the owner here is mixed case.
          image_base="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          # Anything with a hyphen after the patch number is a prerelease and
          # must not move the `latest` tag.
          if echo "$version" | grep -q -- '-'; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          {
            echo "version=$version"
            echo "image_base=$image_base"
            echo "is_prerelease=$is_prerelease"
            echo "publish=$publish"
            echo "tag=${raw}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $version (prerelease=$is_prerelease, publish=$publish)"

  image:
    name: image (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges the job's OIDC token for a
      # short-lived certificate naming this workflow. No key to leak or rotate.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            suffix: ''
          - target: web
            suffix: '-web'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image_base }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            # Also as vX.Y.Z, the form the git tag uses, so either spelling of
            # MODULO_TAG pulls.
            type=semver,pattern=v{{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_prerelease == 'false' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          # The vendor and assets stages are pinned to BUILDPLATFORM in the
          # Dockerfile; without that, arm64 fails on the x64-only rollup,
          # oxide and lightningcss binaries pinned in package.json.
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODULO_VERSION=${{ needs.prepare.outputs.version }}
            MODULO_COMMIT=${{ github.sha }}
            MODULO_BUILT_AT=${{ needs.prepare.outputs.built_at }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          # SLSA provenance and an SPDX SBOM, attached to the image as
          # attestations (docker buildx imagetools inspect --format '{{ json .SBOM }}').
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: needs.prepare.outputs.publish == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        if: needs.prepare.outputs.publish == 'true'
        env:
          IMAGE: ${{ needs.prepare.outputs.image_base }}${{ matrix.suffix }}
          DIGEST: ${{ steps.build.outputs.digest }}
        # By digest, never by tag: a tag can be moved, a digest cannot.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Record the digest for the release manifest
        run: echo "${{ steps.build.outputs.digest }}" > "digest-${{ matrix.target }}.txt"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.target }}
          path: digest-${{ matrix.target }}.txt
          retention-days: 7

  tarball:
    name: tarball
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Stamp the version
        run: |
          echo "${{ needs.prepare.outputs.version }}" > VERSION
          cat VERSION

      - name: Install PHP dependencies (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Create tarball
        id: pack
        run: |
          set -euo pipefail
          name="modulo-cms-${{ needs.prepare.outputs.version }}"

          # Deliberately tar the working tree rather than using `git archive`:
          # the whole point is to ship vendor/ and public/build, which git does
          # not track.
          tar -czf "${RUNNER_TEMP}/${name}.tar.gz" \
            --transform "s,^\./,${name}/," \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./.env' \
            --exclude='./.env.dev' \
            --exclude='./.env.prod' \
            --exclude='./.env.local' \
            --exclude='./.env.testing' \
            --exclude='./storage/logs/*' \
            --exclude='./storage/framework/cache/*' \
            --exclude='./storage/framework/sessions/*' \
            --exclude='./storage/framework/views/*' \
            --exclude='./bootstrap/cache/*.php' \
            --exclude='./phpstan-baseline.neon' \
            ./

          mv "${RUNNER_TEMP}/${name}.tar.gz" .
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Verify the tarball is self-contained
        run: |
          set -euo pipefail
          name="${{ steps.pack.outputs.name }}"

          # A bare-metal install must not need Composer or Node, so the two
          # build outputs have to be inside. And secrets must not be.
          tar -tzf "${name}.tar.gz" > listing.txt
          grep -q "^${name}/vendor/autoload.php$" listing.txt
          grep -q "^${name}/public/build/manifest.json$" listing.txt
          grep -q "^${name}/VERSION$" listing.txt
          ! grep -qE "^${name}/\.git/" listing.txt
          ! grep -qE "^${name}/\.env$" listing.txt
          ! grep -qE "^${name}/\.env\.prod$" listing.txt
          grep -q "^${name}/.env.example$" listing.txt
          grep -q "^${name}/.env.prod.example$" listing.txt
          ! grep -qE "^${name}/node_modules/" listing.txt

          echo "Tarball verified: $(wc -l < listing.txt) entries, $(du -h "${name}.tar.gz" | cut -f1)"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: |
            ${{ steps.pack.outputs.name }}.tar.gz
            ${{ steps.pack.outputs.name }}.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [prepare, image, tarball]
    if: needs.prepare.outputs.publish == 'true'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The manifest compares against the previous release's tag.
          fetch-depth: 0

      - name: Download tarball
        uses: actions/download-artifact@v8
        with:
          name: release-tarball
          path: dist

      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests

      - name: Stage deployment files
        run: |
          cp docker/docker-compose.yml dist/docker-compose.yml
          # Without the leading dot: GitHub renames dotfile assets to
          # "default.<name>", which nobody would recognise.
          cp .env.prod.example dist/env.prod.example
          cp install.sh install.ps1 dist/
          # The site helper the installers place next to docker-compose.yml.
          cp docker/modulo dist/modulo

      # A machine-readable description of the release, so the updater (and
      # anyone scripting upgrades) does not have to scrape the changelog.
      - name: Write release.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          BUILT_AT: ${{ needs.prepare.outputs.built_at }}
          IMAGE_BASE: ${{ needs.prepare.outputs.image_base }}
        run: |
          set -euo pipefail
          prev="$(git tag --list 'v*' --sort=-v:refname --no-contains HEAD | grep -v -- '-' | head -n1 || true)"
          range="${prev:+${prev}..}HEAD"

          # Migrations added since the previous release (core and bundled plugins).
          migrations="$(git diff --name-only --diff-filter=A ${prev:+"$prev"} HEAD -- \
            database/migrations 'plugins/*/database/migrations' | grep -c '\.php$' || true)"

          log="$(git log --format=%B "$range")"
          breaking=false
          if echo "$log" | grep -qE '^BREAKING[ -]CHANGE:|^[a-z]+(\([^)]*\))?!:'; then breaking=true; fi
          # fix(security): ... / SECURITY: footer
          security=false
          if echo "$log" | grep -qiE '^[a-z]+\(security\)!?:|^security:'; then security=true; fi

          tarball="modulo-cms-${VERSION}.tar.gz"
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg channel "$([ "$IS_PRERELEASE" = true ] && echo beta || echo stable)" \
            --arg published_at "$BUILT_AT" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg previous "${prev#v}" \
            --arg notes_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --arg min_php "$(jq -r '.require.php' composer.json)" \
            --argjson migrations "${migrations:-0}" \
            --argjson breaking "$breaking" \
            --argjson security "$security" \
            --arg tarball "$tarball" \
            --arg tarball_sha256 "$(cut -d' ' -f1 "dist/${tarball}.sha256")" \
            --arg app_image "$IMAGE_BASE" \
            --arg app_digest "$(cat digests/digest-app.txt)" \
            --arg web_image "${IMAGE_BASE}-web" \
            --arg web_digest "$(cat digests/digest-web.txt)" \
            '{
              schema: 1,
              version: $version,
              tag: $tag,
              channel: $channel,
              published_at: $published_at,
              commit: $commit,
              previous_version: (if $previous == "" then null else $previous end),
              notes_url: $notes_url,
              security: $security,
              breaking: $breaking,
              requires_migrations: ($migrations > 0),
              new_migrations: $migrations,
              requirements: { php: $min_php, postgres: ">=16" },
              artifacts: {
                tarball: { name: $tarball, sha256: $tarball_sha256, signature: ($tarball + ".sigstore.json") },
                images: {
                  app: { image: $app_image, digest: $app_digest },
                  web: { image: $web_image, digest: $web_digest }
                }
              }
            }' > dist/release.json
          cat dist/release.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signatures (a Sigstore bundle per file) proving the files were
      # produced by this workflow in this repository. Verify with
      # `cosign verify-blob` as described in docs/releasing.md.
      - name: Sign the tarball and the manifest
        run: |
          set -euo pipefail
          tarball="modulo-cms-${{ needs.prepare.outputs.version }}.tar.gz"
          cosign sign-blob --yes --bundle "dist/${tarball}.sigstore.json" "dist/${tarball}"
          cosign sign-blob --yes --bundle dist/release.json.sigstore.json dist/release.json

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          # release-please owns the release body; do not overwrite its changelog.
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.sigstore.json
            dist/release.json
            dist/release.json.sigstore.json
            dist/docker-compose.yml
            dist/env.prod.example
            dist/install.sh
            dist/install.ps1
            dist/modulo
