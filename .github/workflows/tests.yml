name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite:
    name: tests (sqlite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Tests
        run: ./vendor/bin/pest

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: pcov

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests with coverage
        run: php artisan test --coverage-clover=coverage.xml

      # A ratchet: coverage may rise, never fall below what was recorded.
      - name: Line coverage must not drop
        run: |
          set -euo pipefail
          current=$(php -r '$x = simplexml_load_file("coverage.xml"); $m = $x->project->metrics; printf("%.2f", 100 * (int) $m["coveredstatements"] / max(1, (int) $m["statements"]));')
          recorded=$(php -r '$b = json_decode(file_get_contents(".github/quality-baseline.json"), true); echo $b["php_line_coverage"] ?? "";')
          echo "### PHP line coverage: ${current}%" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${recorded}" ]; then
            echo "::notice::PHP line coverage is ${current}%. Record it as php_line_coverage in .github/quality-baseline.json to enforce it."
            exit 0
          fi
          if php -r "exit((float) '${current}' + 0.5 < (float) '${recorded}' ? 0 : 1);"; then
            echo "::error::PHP line coverage fell to ${current}% (recorded ${recorded}%). Add tests for the new code."
            exit 1
          fi

  pgsql:
    name: tests (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: modulo_test
          POSTGRES_USER: modulo
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modulo -d modulo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: modulo
      DB_PASSWORD: secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify fresh migration + seed on PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: modulo_test
        run: |
          php artisan migrate:fresh --seed --force
          php artisan migrate:status

      - name: Tests (PostgreSQL)
        run: ./vendor/bin/pest -c phpunit.pgsql.xml

  upgrade-bases:
    name: pick releases to upgrade from
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.pick.outputs.bases }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the three newest earlier stable releases
        id: pick
        run: |
          set -euo pipefail
          # Releases that do not already contain this commit: when a release run
          # calls this workflow, the tag it just created points at HEAD, and
          # upgrading from that would upgrade from itself and test nothing.
          # Prereleases are skipped; people upgrade from what they installed.
          bases="$(git tag --list 'v*' --sort=-v:refname --no-contains HEAD \
            | grep -v -- '-' | head -n3 | jq -R . | jq -sc .)"
          if [ "$bases" = "[]" ]; then
            # Only when the repository has no earlier release at all.
            bases='["9d225ca"]'
          fi
          echo "Upgrading from: ${bases}"
          echo "bases=${bases}" >> "$GITHUB_OUTPUT"

  upgrade:
    name: upgrade from ${{ matrix.base }}
    runs-on: ubuntu-latest
    needs: upgrade-bases
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJson(needs.upgrade-bases.outputs.bases) }}

    # migrate:fresh proves a new install works and says nothing about upgrading
    # one that already has data. This migrates a real old database to HEAD,
    # which is the case that actually breaks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: modulo_upgrade
          POSTGRES_USER: modulo
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modulo -d modulo_upgrade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: modulo_upgrade
      DB_USERNAME: modulo
      DB_PASSWORD: secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Build a database at the older version
        run: |
          set -euo pipefail
          git checkout --detach "${{ matrix.base }}"
          composer install --no-interaction --prefer-dist --optimize-autoloader
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          # Seed the way that version did, so the upgrade runs against content.
          php artisan db:seed --force
          php artisan migrate:status | tail -n 5

      - name: Return to the version under test
        run: |
          set -euo pipefail
          git checkout --force "${GITHUB_SHA}"
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preflight the upgrade
        run: php artisan modulo:upgrade --dry-run

      # The real command a site runs, not a bare migrate: maintenance window,
      # migrations, bootstrap data, caches. The runner's pg_dump does not match
      # the server's major version, so the backup step is skipped here.
      - name: Upgrade the existing database to HEAD
        run: php artisan modulo:upgrade --skip-backup --no-interaction

      - name: Assert the site is not left in maintenance mode
        run: |
          set -euo pipefail
          if [ -f storage/framework/down ]; then
            echo "::error::modulo:upgrade left the site in maintenance mode."
            exit 1
          fi

      - name: Assert nothing is left pending
        run: |
          set -euo pipefail
          php artisan migrate:status
          if php artisan migrate:status | grep -q 'Pending'; then
            echo "::error::Migrations are still pending after upgrading."
            exit 1
          fi

      - name: Assert bootstrap data is idempotent on an upgraded database
        run: php artisan db:seed --class=BootstrapSeeder --force

      - name: Assert the application still boots
        run: |
          set -euo pipefail
          php artisan serve --port=8123 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8123/up >/dev/null 2>&1; then
              echo "Application responded after upgrading."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The application did not respond after upgrading."
          exit 1

  # One stable check name over the matrix, so branch protection does not have
  # to list a job per release (and does not break when the releases change).
  upgrade-result:
    name: upgrade an existing database
    runs-on: ubuntu-latest
    needs: upgrade
    if: always()
    steps:
      - name: Every upgrade path passed
        run: |
          if [ "${{ needs.upgrade.result }}" != "success" ]; then
            echo "::error::An upgrade path failed (result: ${{ needs.upgrade.result }})."
            exit 1
          fi

  frontend:
    name: frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests (Vitest)
        run: npm run test:js

      - name: Build assets
        run: npm run build

      # Kept so a broken bundle can be inspected without reproducing the build.
      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: public-build-${{ github.sha }}
          path: public/build
          retention-days: 7
          if-no-files-found: error
