name: e2e

# Drives the install wizard in a real browser against a real stack.
#
# Worth the runtime because the wizard is the highest-stakes surface in the
# application: it creates an administrator without authentication and then has
# to make itself unreachable. Its failure modes live in the browser, where a
# feature test cannot see them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-wizard:
    name: install wizard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_DB: modulo_e2e
          POSTGRES_USER: modulo
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modulo -d modulo_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: modulo_e2e
      DB_USERNAME: modulo
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      PHP_CLI_SERVER_WORKERS: '4'
      MODULO_E2E_URL: http://127.0.0.1:8000
      # Asset and link URLs must match where the browser reaches the app.
      APP_URL: http://127.0.0.1:8000
      ASSET_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none
          extensions: pdo_pgsql, gd, exif, bcmath, zip, intl, mbstring, openssl

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/composer
            ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare the application
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          setup_token=$(php artisan modulo:install-token)
          echo "::add-mask::$setup_token"
          echo "MODULO_E2E_SETUP_TOKEN=$setup_token" >> "$GITHUB_ENV"
          # Deliberately not migrated or seeded: the wizard is what should
          # bring an empty database up, and that is the thing under test.
          npm run build:ssr

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Serve the application
        run: |
          # --no-reload keeps the job's environment: without it, artisan serve
          # unsets every variable outside a short passthrough list and the
          # app re-reads .env, never seeing the DB_* settings above.
          php artisan serve --no-reload --host=127.0.0.1 --port=8000 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Application is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The application did not start."
          exit 1

      - name: Run the end-to-end tests
        env:
          MODULO_E2E_FIXTURES: 'true'
        run: npm run test:e2e --

      - name: Verify server rendering and hydration
        env:
          INERTIA_SSR_ENABLED: 'true'
          MODULO_E2E_SSR: '1'
          MODULO_E2E_URL: http://127.0.0.1:8002
          APP_URL: http://127.0.0.1:8002
          ASSET_URL: http://127.0.0.1:8002
        run: |
          set -euo pipefail
          node bootstrap/ssr/ssr.js >/tmp/modulo-e2e-ssr.log 2>&1 &
          ssr_pid=$!
          trap 'kill "$ssr_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:13714/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/check-ssr.mjs
          php artisan serve --no-reload --host=127.0.0.1 --port=8002 &
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8002/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm run test:e2e -- ssr.spec.ts

      - name: Seed and audit the compact disposable demo
        env:
          MODULO_DEMO: 'true'
          MODULO_E2E_URL: http://127.0.0.1:8001
          APP_URL: http://127.0.0.1:8001
          ASSET_URL: http://127.0.0.1:8001
          MODULO_E2E_DEMO: '1'
          MODULO_E2E_SHOP: '1'
          INERTIA_SSR_ENABLED: 'true'
        run: |
          set -euo pipefail
          node bootstrap/ssr/ssr.js >/tmp/modulo-demo-ssr.log 2>&1 &
          ssr_pid=$!
          trap 'kill "$ssr_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:13714/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          php artisan plugin:install modulo-shop --release=1.10.1 --activate
          php artisan modulo:seed-demo --reset-content --force
          php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); App\Models\SiteSetting::set("site_url", getenv("APP_URL"));'
          # Earlier restore/package checks may have cached normal-site URLs.
          # The demo server must boot with this step's environment.
          php artisan optimize:clear
          php artisan serve --no-reload --host=127.0.0.1 --port=8001 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/health >/dev/null
          npm run test:e2e -- z-demo-integrity.spec.ts z-demo-shop.spec.ts demo-security.spec.ts

      - name: Upload the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
