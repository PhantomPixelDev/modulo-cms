name: e2e

# Drives the install wizard in a real browser against a real stack.
#
# Worth the runtime because the wizard is the highest-stakes surface in the
# application: it creates an administrator without authentication and then has
# to make itself unreachable. Its failure modes live in the browser, where a
# feature test cannot see them.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-wizard:
    name: install wizard
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: modulo_e2e
          POSTGRES_USER: modulo
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modulo -d modulo_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: modulo_e2e
      DB_USERNAME: modulo
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      MODULO_E2E_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          npm ci

      - name: Prepare the application
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate
          # Deliberately not migrated or seeded: the wizard is what should
          # bring an empty database up, and that is the thing under test.
          npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Serve the application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Application is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The application did not start."
          exit 1

      - name: Run the end-to-end tests
        run: npx playwright test

      - name: Upload the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
