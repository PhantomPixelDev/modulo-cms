name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Check only: CI must fail on violations instead of silently fixing them
      - name: PHP code style (Pint)
        run: vendor/bin/pint --test

      # New PHPStan findings fail the build; existing ones live in phpstan-baseline.neon
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Frontend formatting (Prettier)
        run: npm run format:check

      - name: Frontend lint (ESLint)
        run: npx eslint . --quiet

      - name: TypeScript
        run: npm run types

      # Known advisories in locked dependencies fail the build
      - name: PHP dependency audit
        run: composer audit

      - name: JS dependency audit
        run: npm audit --audit-level=high
