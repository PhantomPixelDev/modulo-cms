name: linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Check only: CI must fail on violations instead of silently fixing them
      - name: PHP code style (Pint)
        run: vendor/bin/pint --test

      # New PHPStan findings fail the build; existing ones live in phpstan-baseline.neon
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Frontend formatting (Prettier)
        run: npm run format:check

      - name: Frontend lint (ESLint)
        run: npx eslint . --quiet

      - name: TypeScript
        run: npm run types

      # `any` is only a warning, so it creeps in unnoticed. Its count may only go down.
      - name: TypeScript `any` must not grow
        run: |
          set -euo pipefail
          recorded=$(node -p "require('./.github/quality-baseline.json').eslint_no_explicit_any")
          current=$(npx eslint . --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let n=0;for(const f of JSON.parse(s))for(const m of f.messages)if(m.ruleId==="@typescript-eslint/no-explicit-any")n++;console.log(n)})')
          echo "no-explicit-any: ${current} (recorded ${recorded})"
          if [ "${current}" -gt "${recorded}" ]; then
            echo "::error::TypeScript \`any\` grew from ${recorded} to ${current}. Type the new code instead."
            exit 1
          fi
          if [ "${current}" -lt "${recorded}" ]; then
            echo "::notice::\`any\` is down to ${current}. Lower eslint_no_explicit_any in .github/quality-baseline.json."
          fi

      - name: Frontend unit tests with coverage
        run: npm run test:js:coverage

      - name: Static analysis baseline must not grow
        run: |
          set -euo pipefail
          recorded=$(grep -c 'message:' phpstan-baseline.neon)
          echo "Baseline entries: ${recorded}"

          # Regenerate against the current code and compare. A new entry means
          # new code was added with a known problem and then silenced.
          cp phpstan-baseline.neon /tmp/baseline-before.neon
          vendor/bin/phpstan analyse --generate-baseline --memory-limit=1G --no-progress >/dev/null 2>&1 || true
          regenerated=$(grep -c 'message:' phpstan-baseline.neon)
          cp /tmp/baseline-before.neon phpstan-baseline.neon

          echo "Regenerated entries: ${regenerated}"

          if [ "${regenerated}" -gt "${recorded}" ]; then
            echo "::error::The PHPStan baseline would grow from ${recorded} to ${regenerated}. Fix the new finding rather than baselining it."
            exit 1
          fi

          if [ "${regenerated}" -lt "${recorded}" ]; then
            echo "::notice::The baseline can shrink from ${recorded} to ${regenerated}. Run phpstan --generate-baseline and commit it."
          fi

      # Known advisories in locked dependencies fail the build
      - name: PHP dependency audit
        run: composer audit

      - name: JS dependency audit
        run: npm audit --audit-level=high
